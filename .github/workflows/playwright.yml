name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    environment: TESTRAIL_HOST
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Install TestRail CLI
      run: pip install trcli
    - name: Run Playwright tests
      run: npx playwright test
      continue-on-error: true
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Upload Test Results to TestRail
      if: always()
      env:
        TESTRAIL_HOST: ${{ secrets.TESTRAIL_HOST }}
        TESTRAIL_USERNAME: ${{ secrets.TESTRAIL_USERNAME }}
        TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
        TESTRAIL_PROJECT: ${{ secrets.TESTRAIL_PROJECT }}
      run: |
        echo "HOST present: ${TESTRAIL_HOST:+YES}"
        echo "USERNAME present: ${TESTRAIL_USERNAME:+YES}"
        echo "API KEY present: ${TESTRAIL_API_KEY:+YES}"
        echo "PROJECT present: ${TESTRAIL_PROJECT:+YES}"
        npx tsx upload-results.ts
      continue-on-error: true
