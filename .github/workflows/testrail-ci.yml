name: TestRail Automation

on:
  push:
  workflow_dispatch:
    inputs:
      use_api_publisher:
        description: 'Use custom API publisher instead of trcli'
        type: boolean
        default: true

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true

      - name: Install TRCLI
        if: always() && github.event.inputs.use_api_publisher != 'true'
        run: pip install trcli

      - name: Clean JUnit XML (Remove raw error)
        if: always() && github.event.inputs.use_api_publisher != 'true'
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('test-results/results.xml')
          for tc in tree.findall('.//testcase'):
              failure = tc.find('failure')
              if failure is not None:
                  failure.text = ''
                  for attr in ['message', 'type']:
                      if attr in failure.attrib:
                          del failure.attrib[attr]
                  props = tc.find('properties')
                  if props is None:
                      props = ET.SubElement(tc, 'properties')
                  comment = ET.SubElement(props, 'property')
                  comment.set('name', 'testrail_result_comment')
                  comment.set('value', 'Test case failed. Screenshot and log attached. Text:')
          tree.write('test-results/results.xml', encoding='utf-8', xml_declaration=True)
          "

      - name: Upload results to TestRail via TRCLI
        if: always() && github.event.inputs.use_api_publisher != 'true'
        run: |
          trcli -y \
            -h "${{ secrets.TESTRAIL_HOST }}" \
            -u "${{ secrets.TESTRAIL_USERNAME }}" \
            -p "${{ secrets.TESTRAIL_API_KEY }}" \
            --project "${{ secrets.TESTRAIL_PROJECT_NAME }}" \
            parse_junit \
            -f "test-results/results.xml" \
            --case-matcher property \
            --run-id "${{ vars.TESTRAIL_RUN_ID }}"

      - name: Run Custom API Publisher (Jira + TestRail API)
        if: always() && github.event.inputs.use_api_publisher == 'true'
        env:
          TESTRAIL_HOST: ${{ secrets.TESTRAIL_HOST }}
          TESTRAIL_USERNAME: ${{ secrets.TESTRAIL_USERNAME }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
          TESTRAIL_PROJECT_ID: ${{ secrets.TESTRAIL_PROJECT_ID }}
          JIRA_HOST: ${{ secrets.JIRA_HOST }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          TESTRAIL_RUN_ID: ${{ vars.TESTRAIL_RUN_ID }}
        run: |
          npx tsx scripts/ci-api-publisher.ts
