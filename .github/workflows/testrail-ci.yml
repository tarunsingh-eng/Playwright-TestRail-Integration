name: TestRail Automation

on: [push]

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Install TRCLI
        if: always()
        run: pip install trcli

      - name: Upload results to TestRail
        if: always()
        run: |
          trcli -y \
            -h ${{ secrets.TESTRAIL_HOST }} \
            -u ${{ secrets.TESTRAIL_USERNAME }} \
            -p ${{ secrets.TESTRAIL_PASSWORD }} \
            --project "Learn TestRail with Tarun" \
            parse_junit \
            -f "test-results/results.xml" \
            --title "CI Run #${{ github.run_number }} (${{ github.ref_name }})"
